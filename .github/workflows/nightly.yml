name: Nightly candidate
on:
  schedule:
    - cron: '17 1 * * *'
  push:
    branches: [nightly]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: nightly
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0
      - run: bun install --frozen-lockfile
      - run: bun run setup:security
      - run: bun run security:history
      - run: bun audit
      - run: bun run format:check
      - run: bun run verify
      - run: bun run security:files
      - run: bunx playwright install --with-deps chromium
      - run: bun run verify:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-${{ github.run_number }}-${{ github.sha }}
          path: dist/
          retention-days: 14
